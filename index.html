<!DOCTYPE html>
<html>
<head>
    <title>BIR Income Tax Return System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #cccccc;
        }

        h1 {
            text-align: center;
            color: #315b3b;
        }

        p {
            text-align: center;
            color: #555555;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #315b3b;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #24452d;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            background-color: #eef5ee;
            border-radius: 5px;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>BIR Income Tax Return System</h1>

        <p>Government Employee Income Tax Calculator</p>

        <label>Employee Name</label>
        <input type="text" id="name" placeholder="Enter employee name">

        <label>Monthly Basic Salary</label>
        <input type="number" id="salary" placeholder="Enter monthly salary">

        <label>Other Monthly Taxable Income</label>
        <input type="number" id="otherIncome" placeholder="Enter other income">

        <label>Number of Months Worked</label>
        <input type="number" id="months" placeholder="Example: 12">

        <button onclick="calculateTax()">Calculate Income Tax</button>

        <div id="result">
            Your tax result will appear here.
        </div>

    </div>

    <script>

        async function calculateTax() {

            const name = document.getElementById("name").value;
            const salary = document.getElementById("salary").value;
            const otherIncome = document.getElementById("otherIncome").value;
            const months = document.getElementById("months").value;

            if (name === "" || salary === "" || otherIncome === "" || months === "") {
                document.getElementById("result").innerText =
                    "Please complete all fields.";
                return;
            }

            const response = await fetch("/calculate", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    salary: salary,
                    otherIncome: otherIncome,
                    months: months
                })
            });

            const data = await response.json();

            document.getElementById("result").innerText = data.result;
        }

    </script>

</body>
</html>
